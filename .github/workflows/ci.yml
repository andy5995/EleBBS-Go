name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # go vet and go build run natively per OS so each build-tagged file is vetted
  # on the platform it targets. Windows builds and tests as 32-bit, matching
  # the released binaries.
  build-test:
    name: ${{ matrix.os }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
          - os: windows-latest
            goarch: "386"
    runs-on: ${{ matrix.os }}
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        if: runner.os == 'Windows'
        run: go test ./...

      # These packages assume DOS paths and fail on Linux until the path
      # handling is OS-aware. Remove each one as it is fixed.
      - name: go test (packages that pass on Linux)
        if: runner.os == 'Linux'
        run: |
          go test $(go list ./... | grep -vxF \
            -e elebbs/internal/config \
            -e elebbs/internal/files \
            -e elebbs/internal/ftp \
            -e elebbs/internal/logon \
            -e elebbs/internal/mail \
            -e elebbs/internal/menu \
            -e elebbs/internal/nntp \
            -e elebbs/internal/quest \
            -e elebbs/internal/term \
            -e elebbs/internal/userbase)
