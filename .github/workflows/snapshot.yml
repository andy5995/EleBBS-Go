name: Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

# Every run publishes to the same "snapshot" release, so a newer push cancels
# an older run instead of racing it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write # needed to publish the snapshot prerelease

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Same programs and flat layout as the elego-N.zip releases. The file
      # name stays fixed so each push replaces the previous asset.
      - name: Build 32-bit Windows programs
        env:
          GOOS: windows
          GOARCH: "386"
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for p in elebbs eleserv elemail; do
            go build -trimpath -o "dist/$p.exe" "./cmd/$p"
          done
          (cd dist && zip -q elego-snapshot.zip elebbs.exe eleserv.exe elemail.exe)

      - name: Publish rolling "snapshot" prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            "Test build of the latest main commit (${GITHUB_SHA:0:7})." \
            "" \
            "Not a stable release." \
            "Binaries are unsigned; Windows SmartScreen may warn on first run." \
            > "$RUNNER_TEMP/notes.md"
          # Edit rather than delete and recreate, so watchers are not notified
          # on every push.
          if gh release view snapshot >/dev/null 2>&1; then
            gh release edit snapshot --prerelease --title snapshot --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload snapshot dist/elego-snapshot.zip --clobber
          else
            gh release create snapshot dist/elego-snapshot.zip --prerelease --target "$GITHUB_SHA" --title snapshot --notes-file "$RUNNER_TEMP/notes.md"
          fi
